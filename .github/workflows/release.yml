name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. v2.3.9). Creates the tag if missing.'
        required: true
        default: ''
      create_release:
        description: 'Create a GitHub Release for the tag'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # ponytail: keystore 走账户级 secrets（gh secret set RELEASE_KEYSTORE_B64），不随仓库分发
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > keystore/gkschedule.keystore

      - name: Build release APK
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/keystore/gkschedule.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.create_release }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.create_release }}
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk